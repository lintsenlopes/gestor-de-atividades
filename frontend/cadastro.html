<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - Gestor de Atividades</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="container">

        <div class="card">

            <h1>
                Criar cadastro
            </h1>

            <p class="subtitle">
                Preencha os dados para criar sua conta
            </p>

            <form id="cadastroForm">

                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="sobrenome">
                        Sobrenome
                    </label>

                    <input
                        type="text"
                        id="sobrenome"
                        name="sobrenome"
                        placeholder="Digite seu sobrenome"
                        required
                    >

                </div>

                <!-- Data de nascimento -->

                <div class="form-group">

                    <label for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="dataNascimento"
                        name="dataNascimento"
                        required
                    >

                </div>

                <!-- Login -->

                <div class="form-group">

                    <label for="login">
                        Login
                    </label>

                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Digite seu login"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn"
                >
                    Cadastrar
                </button>

            </form>

            <p class="register-text">
                Já possui uma conta?
            </p>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="window.location.href='index.html'"
            >
                Voltar para o login
            </button>

            <p
                id="cadastroMessage"
                class="message"
            ></p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
